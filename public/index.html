<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGENT CONSOLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #000300;
    --panel:        #010601;
    --border:       #0A1F0A;
    --amber:        #00AA33;
    --amber-bright: #00FF41;
    --amber-dim:    #0A3D12;
    --amber-glow:   rgba(0, 200, 50, 0.07);
    --green:        #00AA33;
    --green-bright: #00FF41;
    --red:          #B02818;
    --red-bright:   #E03020;
    --text:         #00BB35;
    --text-bright:  #00FF41;
    --text-dim:     #0A3D12;
    --scan-line:    rgba(0,0,0,0.06);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    line-height: 1.5;
  }

  /* scan lines overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      var(--scan-line) 2px,
      var(--scan-line) 4px
    );
    z-index: 9000;
  }

  /* vignette */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    z-index: 9001;
  }

  /* ── LAYOUT ── */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── HEADER ── */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 40px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    letter-spacing: 0.12em;
  }

  .logo {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--amber-bright);
    text-shadow: 0 0 12px rgba(0,255,65,0.45);
    letter-spacing: 0.15em;
  }

  .logo span { color: var(--amber-dim); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--green-bright);
    text-shadow: 0 0 8px rgba(34, 204, 102, 0.4);
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green-bright);
    box-shadow: 0 0 6px var(--green-bright);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.35; transform: scale(0.7); }
  }

  /* ── MAIN GRID ── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    overflow: hidden;
    background: var(--border);
  }

  /* ── PANEL ── */
  .panel {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    overflow: hidden;
  }

  .panel:first-child { border-right: 1px solid var(--border); }

  .panel-header {
    flex: 0 0 auto;
    padding: 10px 18px;
    font-family: 'VT323', monospace;
    font-size: 18px;
    letter-spacing: 0.18em;
    color: var(--amber-bright);
    text-shadow: 0 0 10px rgba(0,255,65,0.3);
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-header-tag {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--amber-dim);
    padding: 2px 6px;
    border: 1px solid var(--amber-dim);
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scrollbar-width: thin;
    scrollbar-color: var(--amber-dim) transparent;
  }

  /* ── SECTION ── */
  .section-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--amber-dim);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── WEATHER LATEST ── */
  #weather-latest {
    font-size: 13px;
    color: var(--text-bright);
    text-shadow: 0 0 8px rgba(0,255,65,0.2);
    min-height: 20px;
    word-break: break-all;
  }

  /* ── LOG ── */
  .log-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 240px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--amber-dim) transparent;
  }

  .log-entry {
    font-size: 11px;
    color: var(--text-dim);
    padding: 3px 0;
    border-bottom: 1px solid rgba(30,21,8,0.6);
    opacity: 0;
    animation: fadeSlide 0.35s ease forwards;
    word-break: break-all;
  }

  .log-entry.latest { color: var(--text); }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .log-empty {
    color: var(--text-dim);
    font-size: 11px;
    font-style: italic;
  }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    padding: 7px 14px;
    background: transparent;
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    cursor: pointer;
    transition: all 0.15s;
    text-shadow: 0 0 6px rgba(0,200,50,0.25);
  }

  .btn:hover:not(:disabled) {
    border-color: var(--amber);
    color: var(--amber-bright);
    background: var(--amber-glow);
    text-shadow: 0 0 10px rgba(238,160,32,0.5);
    box-shadow: 0 0 12px rgba(0,200,50,0.12);
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn-primary {
    border-color: var(--amber);
    color: var(--amber-bright);
    background: var(--amber-glow);
  }

  /* ── PROVIDER TOGGLE ── */
  .provider-group {
    display: flex;
    gap: 0;
  }

  .provider-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    padding: 5px 12px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }

  .provider-btn:first-child { border-right: none; }

  .provider-btn.active {
    border-color: var(--amber-dim);
    color: var(--amber);
    background: var(--amber-glow);
    text-shadow: 0 0 6px rgba(0,200,50,0.3);
  }

  .provider-btn:hover:not(.active) {
    border-color: var(--text-dim);
    color: var(--text);
  }

  /* ── TEXTAREA ── */
  textarea {
    width: 100%;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    color: var(--text-bright);
    padding: 10px 12px;
    resize: vertical;
    min-height: 64px;
    outline: none;
    transition: border-color 0.15s;
    caret-color: var(--amber-bright);
  }

  textarea::placeholder { color: var(--text-dim); }

  textarea:focus {
    border-color: var(--amber-dim);
    box-shadow: 0 0 8px rgba(0,200,50,0.08);
  }

  /* ── CALC OUTPUT ── */
  .output-box {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    padding: 12px;
    min-height: 80px;
    flex: 1;
    font-size: 13px;
    color: var(--text-bright);
    text-shadow: 0 0 6px rgba(0,255,65,0.15);
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
  }

  .output-box.error { color: var(--red-bright); text-shadow: none; }

  .output-box.loading { color: var(--text-dim); }

  .cursor {
    display: inline-block;
    animation: blink 1s step-end infinite;
    color: var(--amber-bright);
    text-shadow: 0 0 8px rgba(0,255,65,0.6);
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  /* ── CALC HISTORY ── */
  .calc-history {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 180px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--amber-dim) transparent;
  }

  .calc-entry {
    border-left: 2px solid var(--amber-dim);
    padding: 4px 10px;
    opacity: 0;
    animation: fadeSlide 0.3s ease forwards;
  }

  .calc-entry .q {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 3px;
  }

  .calc-entry .a {
    font-size: 12px;
    color: var(--text);
  }

  /* ── FOOTER ── */
  footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    height: 30px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.35);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .footer-item { display: flex; gap: 6px; }
  .footer-val { color: var(--amber-dim); }

  /* ── INPUT ROW ── */
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .input-row textarea { flex: 1; }

  .controls-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* ── AUTOCOMPLETE ── */
  .autocomplete-wrap { position: relative; }

  #city-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 100;
    background: #010901;
    border: 1px solid var(--amber-dim);
    border-top: none;
    max-height: 180px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--amber-dim) transparent;
  }

  #city-dropdown.open { display: block; }

  .ac-item {
    padding: 6px 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.04em;
    transition: background 0.1s;
  }

  .ac-item:last-child { border-bottom: none; }

  .ac-item:hover, .ac-item.active {
    background: var(--amber-glow);
    color: var(--text-bright);
    text-shadow: 0 0 6px rgba(0,255,65,0.3);
  }

  .ac-item mark {
    background: transparent;
    color: var(--green-bright);
    font-style: normal;
  }

  /* ── SPINNER ── */
  @keyframes spin-chars {
    0%   { content: '◐'; }
    25%  { content: '◓'; }
    50%  { content: '◑'; }
    75%  { content: '◒'; }
    100% { content: '◐'; }
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="logo"><span>◆ </span>AGENT CONSOLE</div>
    <div class="header-right">
      <span id="header-clock">--:--:--</span>
      <div class="status-badge">
        <div class="pulse-dot"></div>
        <span>SYSTEM ONLINE</span>
      </div>
    </div>
  </header>

  <main>

    <!-- ── WEATHER PANEL ── -->
    <div class="panel">
      <div class="panel-header">
        WEATHER MONITOR
        <span class="panel-header-tag">BURLINGAME, CA</span>
      </div>
      <div class="panel-body">

        <div>
          <div class="section-label">LATEST READING</div>
          <div id="weather-latest" style="font-size:13px;color:var(--text-bright);min-height:20px;word-break:break-all;text-shadow:0 0 8px rgba(238,160,32,0.2)">—</div>
        </div>

        <div>
          <div class="section-label">HISTORY LOG</div>
          <div class="log-container" id="weather-log">
            <div class="log-empty">NO DATA — RUN A WEATHER CHECK</div>
          </div>
        </div>

        <div class="controls-row">
          <div class="autocomplete-wrap">
            <input id="city-input" type="text" value="Burlingame, CA" placeholder="City, State"
              autocomplete="off"
              style="font-family:'Share Tech Mono',monospace;font-size:12px;background:rgba(0,0,0,0.3);border:1px solid var(--border);color:var(--text-bright);padding:6px 10px;outline:none;width:180px;caret-color:var(--green-bright);letter-spacing:0.05em;transition:border-color 0.15s;"
              onfocus="this.style.borderColor='var(--amber-dim)'" onblur="this.style.borderColor='var(--border)'">
            <div id="city-dropdown"></div>
          </div>
          <button class="btn btn-primary" id="weather-btn" onclick="fetchWeather()">◈ FETCH NOW</button>
          <span id="weather-status" style="font-size:10px;color:var(--text-dim);letter-spacing:0.08em"></span>
        </div>

      </div>
    </div>

    <!-- ── CALCULATOR PANEL ── -->
    <div class="panel">
      <div class="panel-header">
        CALCULATOR AGENT
        <span class="panel-header-tag">TOOL-USE LOOP</span>
      </div>
      <div class="panel-body">

        <div>
          <div class="section-label">QUERY</div>
          <textarea id="calc-input" placeholder="What is (123 * 456) + 789?" rows="2"
            onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey)){event.preventDefault();runCalc();}"></textarea>
        </div>

        <div class="controls-row">
          <div class="provider-group">
            <button class="provider-btn active" id="btn-openai" onclick="setProvider('openai')">OPENAI</button>
            <button class="provider-btn" id="btn-anthropic" onclick="setProvider('anthropic')">ANTHROPIC</button>
          </div>
          <button class="btn btn-primary" id="calc-btn" onclick="runCalc()">▶ EXECUTE</button>
        </div>

        <div>
          <div class="section-label">OUTPUT</div>
          <div class="output-box" id="calc-output"><span class="cursor">█</span></div>
        </div>

        <div id="calc-history-wrap" style="display:none">
          <div class="section-label">HISTORY</div>
          <div class="calc-history" id="calc-history"></div>
        </div>

      </div>
    </div>

  </main>

  <footer>
    <div class="footer-item">TIME <span class="footer-val" id="footer-clock">--:--:--</span></div>
    <div class="footer-item">UPTIME <span class="footer-val" id="uptime">00:00:00</span></div>
    <div class="footer-item">WEATHER CHECKS <span class="footer-val" id="check-count">0</span></div>
    <div class="footer-item">CALCS RUN <span class="footer-val" id="calc-count">0</span></div>
    <div class="footer-item">AUTO-REFRESH <span class="footer-val">15s</span></div>
  </footer>

</div>
<script>
  let provider = 'openai';
  let checks = 0;
  let calcs = 0;
  let startTime = Date.now();
  let weatherSpinInterval = null;

  // ── CLOCK ──
  function tick() {
    const now = new Date();
    const t = now.toTimeString().slice(0, 8);
    document.getElementById('header-clock').textContent = t;
    document.getElementById('footer-clock').textContent = t;
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('uptime').textContent = `${h}:${m}:${s}`;
  }
  setInterval(tick, 1000);
  tick();

  // ── PROVIDER ──
  function setProvider(p) {
    provider = p;
    document.getElementById('btn-openai').classList.toggle('active', p === 'openai');
    document.getElementById('btn-anthropic').classList.toggle('active', p === 'anthropic');
  }

  // ── WEATHER ──
  const spinners = ['◐', '◓', '◑', '◒'];
  let spinIdx = 0;

  function setWeatherLoading(loading) {
    const btn = document.getElementById('weather-btn');
    const status = document.getElementById('weather-status');
    if (loading) {
      btn.disabled = true;
      clearInterval(weatherSpinInterval);
      weatherSpinInterval = setInterval(() => {
        btn.textContent = `${spinners[spinIdx++ % 4]} FETCHING...`;
      }, 140);
    } else {
      clearInterval(weatherSpinInterval);
      btn.disabled = false;
      btn.textContent = '◈ FETCH NOW';
    }
  }

  async function loadWeatherHistory() {
    try {
      const res = await fetch('/api/weather/history');
      const { lines } = await res.json();
      const log = document.getElementById('weather-log');
      const latest = document.getElementById('weather-latest');

      if (!lines.length) {
        log.innerHTML = '<div class="log-empty">NO DATA — RUN A WEATHER CHECK</div>';
        latest.textContent = '—';
        return;
      }

      latest.textContent = lines[0];
      log.innerHTML = lines.map((line, i) =>
        `<div class="log-entry${i === 0 ? ' latest' : ''}" style="animation-delay:${i * 40}ms">${escHtml(line)}</div>`
      ).join('');
    } catch (e) {
      document.getElementById('weather-status').textContent = 'LOAD ERR';
    }
  }

  async function fetchWeather() {
    const city = document.getElementById('city-input').value.trim() || 'Burlingame, CA';
    document.querySelector('.panel-header-tag').textContent = city.toUpperCase();
    setWeatherLoading(true);
    document.getElementById('weather-status').textContent = '';
    try {
      const res = await fetch('/api/weather/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ city }),
      });
      const data = await res.json();
      checks++;
      document.getElementById('check-count').textContent = checks;
      if (data.ok) {
        document.getElementById('weather-status').textContent = '✓ SAVED';
        await loadWeatherHistory();
      } else {
        document.getElementById('weather-status').textContent = '✗ ' + (data.error ?? 'ERR');
        document.getElementById('weather-status').style.color = 'var(--red-bright)';
      }
    } catch (e) {
      document.getElementById('weather-status').textContent = '✗ NETWORK ERR';
      document.getElementById('weather-status').style.color = 'var(--red-bright)';
    } finally {
      setWeatherLoading(false);
      setTimeout(() => {
        document.getElementById('weather-status').textContent = '';
        document.getElementById('weather-status').style.color = '';
      }, 4000);
    }
  }

  // auto-refresh every 15s
  loadWeatherHistory();
  setInterval(loadWeatherHistory, 15000);

  // ── CALCULATOR ──
  async function runCalc() {
    const input = document.getElementById('calc-input');
    const question = input.value.trim();
    if (!question) return;

    const outputEl = document.getElementById('calc-output');
    const btn = document.getElementById('calc-btn');

    btn.disabled = true;
    outputEl.className = 'output-box loading';
    outputEl.textContent = 'PROCESSING';

    let spinI = 0;
    const loadInterval = setInterval(() => {
      outputEl.textContent = 'PROCESSING' + '.'.repeat((spinI++ % 3) + 1);
    }, 400);

    try {
      const res = await fetch('/api/calculator', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, provider }),
      });
      const data = await res.json();
      clearInterval(loadInterval);

      if (data.answer) {
        outputEl.className = 'output-box';
        await typewriter(outputEl, data.answer);

        // add to history
        calcs++;
        document.getElementById('calc-count').textContent = calcs;
        addToHistory(question, data.answer);
        input.value = '';
      } else {
        outputEl.className = 'output-box error';
        outputEl.textContent = '✗ ' + (data.error ?? 'UNKNOWN ERROR');
      }
    } catch (e) {
      clearInterval(loadInterval);
      outputEl.className = 'output-box error';
      outputEl.textContent = '✗ NETWORK ERROR';
    } finally {
      btn.disabled = false;
    }
  }

  async function typewriter(el, text, speed = 18) {
    el.textContent = '';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.textContent = '█';
    el.appendChild(cursor);
    for (const char of text) {
      cursor.before(document.createTextNode(char));
      await delay(speed);
    }
  }

  function addToHistory(q, a) {
    const wrap = document.getElementById('calc-history-wrap');
    const history = document.getElementById('calc-history');
    wrap.style.display = 'block';
    const entry = document.createElement('div');
    entry.className = 'calc-entry';
    entry.innerHTML = `<div class="q">&gt; ${escHtml(q)}</div><div class="a">${escHtml(a)}</div>`;
    history.prepend(entry);
    // cap at 8 entries
    while (history.children.length > 8) history.lastChild.remove();
  }

  // ── AUTOCOMPLETE ──
  let acIndex = -1;
  let acDebounce = null;

  const cityInput = document.getElementById('city-input');
  const cityDropdown = document.getElementById('city-dropdown');

  cityInput.addEventListener('input', () => {
    const q = cityInput.value.trim();
    clearTimeout(acDebounce);
    if (q.length < 2) { closeDropdown(); return; }
    showDropdownLoading();
    acDebounce = setTimeout(() => fetchCities(q), 300);
  });

  cityInput.addEventListener('keydown', (e) => {
    const items = cityDropdown.querySelectorAll('.ac-item');
    if (cityDropdown.classList.contains('open')) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        acIndex = Math.min(acIndex + 1, items.length - 1);
        updateActive(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        acIndex = Math.max(acIndex - 1, -1);
        updateActive(items);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (acIndex >= 0 && items[acIndex]) {
          selectCity(items[acIndex].dataset.city);
        } else {
          closeDropdown();
          fetchWeather();
        }
      } else if (e.key === 'Escape') {
        closeDropdown();
      }
    } else if (e.key === 'Enter') {
      fetchWeather();
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.autocomplete-wrap')) closeDropdown();
  });

  async function fetchCities(q) {
    try {
      const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&layer=city&lang=en`;
      const res = await fetch(url);
      const data = await res.json();

      const seen = new Set();
      const cities = data.features
        .filter(f => f.properties.osm_key === 'place')
        .map(f => {
          const p = f.properties;
          return p.countrycode === 'US' && p.state
            ? `${p.name}, ${p.state}`
            : p.country
            ? `${p.name}, ${p.country}`
            : p.name;
        })
        .filter(label => {
          if (seen.has(label)) return false;
          seen.add(label);
          return true;
        })
        .slice(0, 7);

      if (!cities.length) { closeDropdown(); return; }
      renderDropdown(cities, q);
    } catch {
      closeDropdown();
    }
  }

  function showDropdownLoading() {
    cityDropdown.innerHTML = '<div class="ac-item" style="color:var(--text-dim);cursor:default;">SEARCHING...</div>';
    cityDropdown.classList.add('open');
  }

  function renderDropdown(cities, q) {
    acIndex = -1;
    const ql = q.toLowerCase();
    cityDropdown.innerHTML = cities.map(city => {
      const cl = city.toLowerCase();
      const idx = cl.indexOf(ql);
      const hi = idx >= 0
        ? escHtml(city.slice(0, idx)) + '<mark>' + escHtml(city.slice(idx, idx + q.length)) + '</mark>' + escHtml(city.slice(idx + q.length))
        : escHtml(city);
      return `<div class="ac-item" data-city="${escHtml(city)}" onclick="selectCity('${escHtml(city)}')">${hi}</div>`;
    }).join('');
    cityDropdown.classList.add('open');
  }

  function updateActive(items) {
    items.forEach((el, i) => el.classList.toggle('active', i === acIndex));
    if (acIndex >= 0) items[acIndex]?.scrollIntoView({ block: 'nearest' });
  }

  function selectCity(city) {
    cityInput.value = city;
    closeDropdown();
    cityInput.focus();
  }

  function closeDropdown() {
    cityDropdown.classList.remove('open');
    acIndex = -1;
  }

  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
